# Central version catalog. Versions verified against Google Maven / Maven Central / Gradle
# on 2026-09-19. AGP 9.4 requires Gradle >= 9.6.0, JDK >= 17, build-tools >= 36.0.0.

[versions]
androidGradlePlugin = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
androidxActivity = "1.13.0"
androidxCore = "1.19.0"
androidxNavigation = "2.10.1"
androidxLifecycle = "2.11.0"
androidxDatastore = "1.2.1"
coroutines = "1.11.0"
androidxTestExtJunit = "1.3.0"
junit = "4.13.2"
orgJson = "20260814"
icu4j = "78.3"
room = "2.8.5"
protobuf = "4.29.3"
mlkitDigitalInk = "19.0.0"
ksp = "2.3.12"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
# Android has org.json built in; plain JVM unit tests need the real library.
org-json = { module = "org.json:json", version.ref = "orgJson" }
# Android has ICU built in (android.icu); plain JVM unit tests use the same algorithm from this library.
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
# Local database for the Personal Language Map.
mlkit-digital-ink = { module = "com.google.mlkit:digital-ink-recognition", version.ref = "mlkitDigitalInk" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
# The Compose compiler is versioned together with Kotlin (Kotlin 2.0+).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Generates Room's database code from annotations.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
