# Rime schema
# encoding: utf-8
# Based on rime-stroke (LGPL-3.0); the reverse lookup and other dependencies were removed.

schema:
  schema_id: stroke_simp
  name: 笔画
  version: "1.0"
  author:
    - 四季的風
    - 雪齋
    - Kunki Chou
    - 宋天
  description: |
    h, s, p, n, z stand for the horizontal, vertical, left-falling, dot and turning strokes.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: "hspnz"
  delimiter: " '"

menu:
  page_size: 9

translator:
  dictionary: stroke_simp
  enable_completion: true
  preedit_format:
    - xlit/hspnz/⼀⼁⼃⼂⼄/
  comment_format:
    - xform/~//

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
