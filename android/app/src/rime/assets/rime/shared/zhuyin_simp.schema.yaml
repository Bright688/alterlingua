# Rime schema
# encoding: utf-8
# Zhuyin (bopomofo) input on the Simplified pinyin dictionary. Based on rime-bopomofo (LGPL-3.0); the spelling rules are in zhuyin.yaml.
# The dictionary has no tones, so the tone marks are not typed: give the initial, the final and choose.

schema:
  schema_id: zhuyin_simp
  name: 注音（简体）
  version: "1.0"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    Bopomofo input with the standard (Daqian) key positions, without tones.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

menu:
  page_size: 9

speller:
  alphabet: '1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-'
  initials: '1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-'
  delimiter: "'"
  algebra:
    __patch:
      - zhuyin:/pinyin_to_zhuyin
      - zhuyin:/free_order
      - zhuyin:/keymap_bopomofo

translator:
  dictionary: pinyin_simp
  prism: zhuyin_simp
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ |"

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
