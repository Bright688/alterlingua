# Runs the API behind Caddy, which gets and renews the HTTPS certificate by itself.
# Start with:  docker compose --env-file .env up -d --build     (see DEPLOY.md)
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    restart: unless-stopped
    # Not published to the internet: only Caddy, on the same private network, can reach it.
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ALTERLINGUA_DOMAIN=${ALTERLINGUA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
